name: Warm Rust cache

# Release runs are triggered by tags, and GitHub scopes caches per tag — a cache
# saved by `v0.1.6` is unreachable from `v0.1.7`. Tag runs *can* read the default
# branch's cache, so build the dependency graph here on `main` and let releases
# restore it. The `shared-key`, runner image, and cargo invocation (`tauri
# build`, not bare `cargo build --release`) must match release.yml.
on:
  push:
    branches:
      - main
    paths:
      - "bun.lock"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - ".github/workflows/warm-cache.yml"
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    # A version bump touches Cargo.lock, so every release commit used to start a
    # full release build here — competing with the tag's own release run for a
    # macOS runner, and saving its cache after that run had already restored one.
    if: "!startsWith(github.event.head_commit.message, 'Release v')"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release

      - run: bun install --frozen-lockfile

      # generate_context! embeds the frontend bundle at compile time, so dist/
      # has to exist before cargo runs.
      - run: bun run --cwd apps/desktop build

      # Same cargo invocation as release.yml (tauri CLI, --bins, TAURI_ENV_*),
      # on the same runner image. Bare `cargo build --release` is a different
      # fingerprint and does not warm what the tag actually compiles.
      - run: bun run --cwd apps/desktop sidecar -- --stub --target aarch64-apple-darwin
      - name: Compile with the release fingerprint
        working-directory: apps/desktop
        run: bunx tauri build --target aarch64-apple-darwin --no-bundle --config src-tauri/tauri.ci.conf.json
