name: Release

# Push a version tag (e.g. `v0.1.1`) to build, sign, and publish a release
# with updater artifacts + latest.json. The tag should match the version in
# src-tauri/tauri.conf.json.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  # A release can already have created a GitHub release or uploaded artifacts.
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Validate tag and project versions
        run: bun run release:check -- "${GITHUB_REF_NAME}"

      - name: Ensure tag is based on main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  # Gate the release on the same checks CI runs on main, then publish from this
  # runner. Keeping verification and packaging together avoids a second macOS
  # runner plus a second checkout, toolchain setup, and dependency install.
  release:
    needs: preflight
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Matches warm-cache.yml so tag runs restore the main-branch release
          # cache instead of compiling every dependency from scratch.
          shared-key: release

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: apps/desktop

      - name: Frontend tests
        run: bun run test
        working-directory: apps/desktop

      - name: Clippy
        run: cargo clippy --all-targets
        working-directory: apps/desktop/src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: apps/desktop/src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Emberyx ${{ github.ref_name }}"
          releaseBody: "Download the .dmg to install. Existing installs update in-app."
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
