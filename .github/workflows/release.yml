name: Release

# Push a version tag (e.g. `v0.1.1`) to build, sign, and publish a release
# with updater artifacts + latest.json. The tag should match the version in
# src-tauri/tauri.conf.json.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  # A release can already have created a GitHub release or uploaded artifacts.
  cancel-in-progress: false

jobs:
  # One job, one runner. The validation steps below took their own ubuntu runner
  # before; they finish in under a second, so the runner spin-up was most of
  # their cost.
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the ancestor check below needs main's commits.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Validate tag and project versions
        run: bun run release:check -- "${GITHUB_REF_NAME}"

      # The tag must name a commit that is already on main, which is what makes
      # the checks unnecessary here: main's own Test run covers this commit.
      # A compile break still can't ship — the build below compiles the crate in
      # release mode — so what this trades away is a lint or test regression
      # slipping into a tag whose Test run went red.
      - name: Ensure tag is based on main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Matches warm-cache.yml so tag runs restore the main-branch release
          # cache instead of compiling every dependency from scratch.
          shared-key: release

      - run: bun install --frozen-lockfile

      # The daemon ships inside the .app as a sidecar, or persistent mode has
      # nothing to launch. Tauri resolves `binaries/emberyxd-<triple>` and drops
      # the suffix when bundling, which is what `Daemon::ensure` expects to find
      # next to the main executable. The frontend build comes first because
      # `generate_context!` embeds dist/ at compile time and emberyxd links the
      # same lib.
      - name: Build the emberyxd sidecar
        working-directory: apps/desktop
        run: |
          bun run build
          bun run sidecar -- --target aarch64-apple-darwin

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Emberyx ${{ github.ref_name }}"
          releaseBody: "Download the .dmg to install. Existing installs update in-app."
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
