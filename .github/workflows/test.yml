name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS matches the only shipped target, and skips the webkit2gtk/glib
    # system deps a Linux runner would need just to build the Tauri crate.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Deliberately NOT `release`: this job builds the debug/test profile,
          # and sharing that key would thrash the cache release.yml restores.
          shared-key: test

      - run: bun install --frozen-lockfile

      # The version lives in three manifests and drift is silent until a
      # release ships wrong. Cheap, so it runs before the long steps.
      - name: Version consistency
        run: bun run version:check

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: apps/desktop

      - name: Frontend tests
        run: bun run test
        working-directory: apps/desktop

      - name: Frontend production build
        run: bun run build
        working-directory: apps/desktop

      # Declaring emberyxd as a sidecar makes `tauri-build` demand the file on
      # every cargo command, including these two, which bundle nothing. A stub
      # satisfies that without spending a release compile on a binary no test
      # runs; release.yml builds the real one.
      - name: Sidecar placeholder
        run: bun run sidecar -- --stub --target aarch64-apple-darwin
        working-directory: apps/desktop

      # No `-D warnings`: the crate carries a couple of pre-existing lints, and
      # failing the build on them is a separate decision from adding tests.
      - name: Clippy
        run: cargo clippy --all-targets
        working-directory: apps/desktop/src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: apps/desktop/src-tauri
