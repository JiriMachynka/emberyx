[package]
name = "emberyx"
version = "0.2.14"
description = "Desktop cockpit for AI coding agents — run Claude Code and Codex across projects in integrated terminals."
authors = ["Jiri Machynka <machynka.j@gmail.com>"]
edition = "2021"
# `src/bin/emberyxd.rs` adds a second binary, so a bare `cargo run` (which is
# what `tauri dev` issues) has no unambiguous target without this.
default-run = "emberyx"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emberyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "emberyxd"
path = "src/bin/emberyxd.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
# Signalling a PTY's foreground process group when stopping a dev server.
libc = "0.2"
base64 = "0.22"
glob = "0.3"
regex = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
# Harness MCP config files: Codex/Grok TOML (format-preserving writes via
# toml_edit) and OpenCode/Kilo JSONC (comments allowed, so serde_json alone
# can't read what their CLIs write).
toml = "0.8"
toml_edit = "0.22"
json5 = "0.4"
# OpenCode and Kilo store per-turn tokens in sqlite, not JSONL.
rusqlite = { version = "0.32", features = ["bundled"] }

# Updater is desktop-only (no Android/iOS build).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

# Optimize release builds: full LTO + single codegen unit for faster hot paths
# (PTY read loop, JSONL usage parsing) and a smaller, stripped binary.
[profile.release]
opt-level = 3
# Thin LTO + parallel codegen: most of fat-LTO's wins at a fraction of the CI
# link time. The Rust side is I/O-bound (PTY, git, HTTP), so max codegen tuning
# buys ~nothing at runtime.
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
